[package]
name = "oxipass-tui"
version = "1.0.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
gcm = { path = "../gcm/" }
ratatui = "0.29"
rpassword = "7"
serde = { version = "1.0.228", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = [
    "rust_backend",
] }
serde_json = "1.0.150"
thiserror = "2.0.16"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.10.1"
sha2 = "0.10"
zxcvbn = "3.1.1"
totp-rs = { version = "5.7.1", features = ["otpauth"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[dev-dependencies]
tempfile = "3"
