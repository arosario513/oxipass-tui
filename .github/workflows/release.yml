name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: oxipass-tui
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: oxipass-tui
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: oxipass-tui
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: oxipass-tui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: oxipass-tui.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p oxipass-tui
          else
            cargo build --release --target ${{ matrix.target }} -p oxipass-tui
          fi

      - name: Package
        shell: bash
        run: |
          mkdir dist
          ext="${{ matrix.binary == 'oxipass-tui.exe' && '.exe' || '' }}"
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             dist/oxipass-tui-${{ matrix.target }}${ext}

      - uses: actions/upload-artifact@v4
        with:
          name: oxipass-tui-${{ matrix.target }}
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
